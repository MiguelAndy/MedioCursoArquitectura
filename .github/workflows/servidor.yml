name: Servidor (fase 2)

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generar clases desde el XSD, compilar, pruebas, reglas de arquitectura y cobertura
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-servidor
          path: servidor/target/site/jacoco/
