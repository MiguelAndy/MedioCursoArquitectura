openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ABC Comercial - API de facturación electrónica, inventario y migración
  version: 1.0.0
  summary: Contrato Spec-First del monolito modular MVC de ABC Software Corp (fase 1).
  description: |
    Contrato de interfaz entre las vistas nativas (Windows/Android) y los controladores del monolito.
    Se escribió **antes** que cualquier línea de lógica de negocio (metodología Spec-First):
    los servidores implementan las interfaces generadas a partir de este archivo y los clientes
    consumen un SDK generado del mismo archivo.

    Convenciones:
    - Importes como texto decimal con el formato SUNAT (n(12,2) importes, n(12,10) unitarios).
    - Errores en `application/problem+json` (RFC 9457) con la regla `VAL-*` violada.
    - `POST /comprobantes` exige la cabecera `Idempotency-Key`: un reintento del cliente nunca duplica un comprobante.
    - Concurrencia optimista con `ETag` / `If-Match` en recursos editables.
    - Extensiones de trazabilidad por operación: `x-modulo` (bounded context), `x-puerto-entrada`
      (caso de uso hexagonal que atiende el controlador), `x-casos-uso` y `x-reglas`.
  contact:
    name: Equipo de arquitectura ABC Software Corp
  license:
    name: Uso académico
    identifier: CC-BY-4.0
servers:
  - url: https://servidor-abc:8443/api/v1
    description: Servidor on-premise en la LAN de ABC (instalado con MSI como servicio de Windows)
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Autenticación
    description: Sesión por dispositivo y renovación de tokens (módulo seguridad).
  - name: Configuración
    description: Empresa, series por punto de emisión, certificado digital y canal OSE/SUNAT.
  - name: Catálogos SUNAT
    description: Catálogos del Anexo N.° 8 y parámetros tributarios con vigencia (módulo tributacion).
  - name: Terceros
    description: Clientes y proveedores con validación de RUC/DNI (cierra la brecha G-01).
  - name: Productos
    description: Maestro de productos con afectación IGV (Cat. 07), ISC (Cat. 08) e ICBPER.
  - name: Inventario
    description: Kardex alineado al Formato 12.1 de la RS 234-2006.
  - name: Comprobantes
    description: Emisión, consulta y descarga de CPE UBL 2.1 firmados (factura, boleta, notas).
  - name: Bajas y resúmenes
    description: Comunicación de baja (RA) y resumen diario (RC) vía sendSummary/getStatus.
  - name: Registros
    description: Registro de Ventas (14.1/RVIE) e Inventario Permanente en Unidades Físicas (12.1).
  - name: Migración
    description: Carga del legado a staging, revisión, conciliación, confirmación y linaje.
  - name: Sistema
    description: Salud, versión mínima de clientes MSI/APK y auditoría.

paths:
  /auth/token:
    post:
      tags: [Autenticación]
      operationId: obtenerToken
      summary: Inicia sesión desde un dispositivo registrado
      security: []
      x-modulo: seguridad
      x-puerto-entrada: AutenticarUsuarioUseCase
      x-casos-uso: [CU-27]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '426':
          description: La versión del cliente es menor que la mínima soportada; debe actualizar el MSI o el APK.
          content:
            application/problem+json:
              schema: { $ref: '../schemas/problema.schema.json' }

  /auth/token/renovacion:
    post:
      tags: [Autenticación]
      operationId: renovarToken
      summary: Renueva el token de acceso con el token de refresco
      security: []
      x-modulo: seguridad
      x-puerto-entrada: AutenticarUsuarioUseCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /configuracion/empresa:
    get:
      tags: [Configuración]
      operationId: obtenerEmpresa
      summary: Datos del emisor y sus establecimientos (domicilio fiscal y anexos)
      x-modulo: configuracion
      x-puerto-entrada: ConsultarEmpresaUseCase
      x-casos-uso: [CU-24]
      responses:
        '200':
          description: Empresa emisora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empresa' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /configuracion/series:
    get:
      tags: [Configuración]
      operationId: listarSeries
      summary: Series autorizadas por tipo de comprobante y punto de emisión
      x-modulo: facturacion
      x-puerto-entrada: GestionarSeriesUseCase
      x-casos-uso: [CU-24]
      parameters:
        - name: tipoComprobante
          in: query
          schema: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Cat01ComprobanteEmitible' }
        - name: puntoEmisionId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Serie' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
    post:
      tags: [Configuración]
      operationId: crearSerie
      summary: Registra una serie para un punto de emisión (una serie por caja o dispositivo)
      x-modulo: facturacion
      x-puerto-entrada: GestionarSeriesUseCase
      x-casos-uso: [CU-24]
      x-reglas: [VAL-NUM-01, VAL-NUM-04]
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SerieRequest' }
      responses:
        '201':
          description: Serie creada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Serie' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /configuracion/certificados:
    post:
      tags: [Configuración]
      operationId: cargarCertificado
      summary: Carga el certificado digital (.pfx) usado para firmar los XML
      description: El certificado y su clave quedan cifrados en el servidor; nunca se distribuyen a los dispositivos (ADR-04).
      x-modulo: cpe
      x-puerto-entrada: GestionarCertificadoUseCase
      x-casos-uso: [CU-25]
      x-reglas: [VAL-ENV-02]
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, clave]
              properties:
                archivo:
                  type: string
                  contentMediaType: application/x-pkcs12
                clave:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '201':
          description: Certificado cargado y verificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificadoInfo' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /configuracion/certificados/vigente:
    get:
      tags: [Configuración]
      operationId: obtenerCertificadoVigente
      summary: Metadatos del certificado vigente (sin la llave privada)
      x-modulo: cpe
      x-puerto-entrada: GestionarCertificadoUseCase
      x-casos-uso: [CU-25]
      responses:
        '200':
          description: Certificado vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificadoInfo' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /configuracion/canal-envio:
    put:
      tags: [Configuración]
      operationId: configurarCanalEnvio
      summary: Define el canal de envío (OSE o SUNAT) y el ambiente (beta o producción)
      x-modulo: cpe
      x-puerto-entrada: ConfigurarCanalEnvioUseCase
      x-casos-uso: [CU-26]
      x-reglas: [VAL-ENV-06]
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanalEnvioRequest' }
      responses:
        '200':
          description: Canal configurado y probado (conexión y credenciales)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanalEnvio' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /catalogos/{numero}:
    get:
      tags: [Catálogos SUNAT]
      operationId: obtenerCatalogo
      summary: Catálogo SUNAT (Anexo N.° 8) o tabla de la RS 234-2006 vigente a una fecha
      x-modulo: tributacion
      x-puerto-entrada: ConsultarCatalogoUseCase
      x-casos-uso: [CU-12]
      parameters:
        - name: numero
          in: path
          required: true
          description: Número de catálogo SUNAT (01..60) o tabla de libros (T02, T05, T06, T10, T12).
          schema:
            type: string
            pattern: '^(\d{2}|T\d{2})$'
            examples: ['08']
        - name: fecha
          in: query
          description: Fecha de vigencia (por defecto, hoy).
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogo' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /parametros-tributarios:
    get:
      tags: [Catálogos SUNAT]
      operationId: listarParametrosTributarios
      summary: Parámetros normativos con vigencia (tasa IGV, tarifa ICBPER, umbrales y plazos)
      x-modulo: tributacion
      x-puerto-entrada: ConsultarParametrosTributariosUseCase
      x-reglas: [VAL-TRB-01, VAL-TRB-06, VAL-BOL-01, VAL-FEC-02, VAL-BAJ-01]
      parameters:
        - name: fecha
          in: query
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
      responses:
        '200':
          description: Parámetros vigentes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParametroTributario' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /terceros:
    get:
      tags: [Terceros]
      operationId: buscarTerceros
      summary: Busca clientes o proveedores por documento o nombre
      x-modulo: terceros
      x-puerto-entrada: BuscarTercerosUseCase
      x-casos-uso: [CU-11]
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
        - name: tipoDocumento
          in: query
          schema: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Cat06TipoDocumentoIdentidad' }
        - name: numeroDocumento
          in: query
          schema: { type: string }
        - name: rol
          in: query
          schema: { type: string, enum: [CLIENTE, PROVEEDOR] }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de terceros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaTerceros' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
    post:
      tags: [Terceros]
      operationId: registrarTercero
      summary: Registra un cliente o proveedor validando su documento
      x-modulo: terceros
      x-puerto-entrada: RegistrarTerceroUseCase
      x-casos-uso: [CU-11]
      x-reglas: [VAL-ID-01, VAL-ID-02, VAL-ID-04, VAL-ID-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/tercero.schema.json#/$defs/TerceroRequest' }
      responses:
        '201':
          description: Tercero registrado
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/tercero.schema.json#/$defs/Tercero' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /terceros/{terceroId}:
    parameters:
      - name: terceroId
        in: path
        required: true
        schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
    get:
      tags: [Terceros]
      operationId: obtenerTercero
      summary: Obtiene un tercero
      x-modulo: terceros
      x-puerto-entrada: BuscarTercerosUseCase
      responses:
        '200':
          description: Tercero
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/tercero.schema.json#/$defs/Tercero' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Terceros]
      operationId: actualizarTercero
      summary: Actualiza un tercero (concurrencia optimista)
      x-modulo: terceros
      x-puerto-entrada: RegistrarTerceroUseCase
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/tercero.schema.json#/$defs/TerceroRequest' }
      responses:
        '200':
          description: Tercero actualizado
          content:
            application/json:
              schema: { $ref: '../schemas/tercero.schema.json#/$defs/Tercero' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '412': { $ref: '#/components/responses/PrecondicionFallida' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /consultas/ruc/{ruc}:
    get:
      tags: [Terceros]
      operationId: consultarRuc
      summary: Valida un RUC (formato, dígito verificador) y lo consulta en el padrón
      description: Cierra la brecha "no valida RUCs" (G-01). Fuente primaria, el padrón reducido del RUC descargado a diario; si falla, un servicio externo (puerto ConsultaContribuyentePort).
      x-modulo: terceros
      x-puerto-entrada: ConsultarRucUseCase
      x-casos-uso: [CU-11]
      x-reglas: [VAL-ID-01, VAL-ID-02, VAL-ID-04]
      parameters:
        - name: ruc
          in: path
          required: true
          schema: { type: string, pattern: '^\d{11}$' }
      responses:
        '200':
          description: Resultado de la validación y consulta
          content:
            application/json:
              schema: { $ref: '../schemas/tercero.schema.json#/$defs/ConsultaRucResponse' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /productos:
    get:
      tags: [Productos]
      operationId: buscarProductos
      summary: Busca productos por código, código de barras o texto
      x-modulo: catalogo
      x-puerto-entrada: BuscarProductosUseCase
      x-casos-uso: [CU-12]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: codigo
          in: query
          schema: { type: string }
        - name: gtin
          in: query
          schema: { type: string, pattern: '^\d{8,14}$' }
        - name: activo
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema: { $ref: '../schemas/producto.schema.json#/$defs/PaginaProductos' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Crea un producto con su tratamiento tributario por defecto
      x-modulo: catalogo
      x-puerto-entrada: GestionarProductoUseCase
      x-casos-uso: [CU-12]
      x-reglas: [VAL-ITM-03, VAL-ITM-06, VAL-TRB-03, VAL-TRB-04]
      x-roles: [ADMINISTRADOR, CONTADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/producto.schema.json#/$defs/ProductoRequest' }
      responses:
        '201':
          description: Producto creado
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/producto.schema.json#/$defs/Producto' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /productos/{productoId}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      operationId: obtenerProducto
      summary: Obtiene un producto
      x-modulo: catalogo
      x-puerto-entrada: BuscarProductosUseCase
      responses:
        '200':
          description: Producto
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/producto.schema.json#/$defs/Producto' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Productos]
      operationId: actualizarProducto
      summary: Actualiza un producto (concurrencia optimista)
      x-modulo: catalogo
      x-puerto-entrada: GestionarProductoUseCase
      x-roles: [ADMINISTRADOR, CONTADOR]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/producto.schema.json#/$defs/ProductoRequest' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '../schemas/producto.schema.json#/$defs/Producto' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '412': { $ref: '#/components/responses/PrecondicionFallida' }

  /productos/importaciones:
    post:
      tags: [Productos]
      operationId: importarProductos
      summary: Importa productos desde una hoja de cálculo (proceso asíncrono)
      x-modulo: catalogo
      x-puerto-entrada: ImportarProductosUseCase
      x-casos-uso: [CU-13]
      x-roles: [ADMINISTRADOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '202':
          description: Importación aceptada; el resultado se consulta en el enlace devuelto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoAceptado' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /inventario/existencias:
    get:
      tags: [Inventario]
      operationId: consultarExistencias
      summary: Stock por almacén y producto
      x-modulo: inventario
      x-puerto-entrada: ConsultarExistenciasUseCase
      x-casos-uso: [CU-16]
      parameters:
        - name: almacenId
          in: query
          schema: { type: string }
        - name: productoId
          in: query
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Existencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../schemas/inventario.schema.json#/$defs/Existencia' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /inventario/movimientos:
    get:
      tags: [Inventario]
      operationId: listarMovimientos
      summary: Movimientos de inventario (kardex) con filtros
      x-modulo: inventario
      x-puerto-entrada: ConsultarExistenciasUseCase
      x-casos-uso: [CU-16]
      parameters:
        - name: productoId
          in: query
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
        - name: almacenId
          in: query
          schema: { type: string }
        - name: origen
          in: query
          schema: { type: string, enum: [VENTA, NOTA_CREDITO, COMPRA, AJUSTE, TRANSFERENCIA, MIGRACION] }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
