        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de registros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRegistrosMigracion' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /migraciones/registros/{registroId}:
    patch:
      tags: [Migración]
      operationId: resolverRegistro
      summary: Resuelve manualmente un registro observado (queda en el linaje)
      x-modulo: migracion
      x-puerto-entrada: ResolverRegistroObservadoUseCase
      x-casos-uso: [CU-18]
      x-roles: [ADMINISTRADOR, CONTADOR]
      parameters:
        - name: registroId
          in: path
          required: true
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '../schemas/migracion.schema.json#/$defs/ResolucionRegistro' }
      responses:
        '200':
          description: Registro resuelto
          content:
            application/json:
              schema: { $ref: '../schemas/migracion.schema.json#/$defs/RegistroMigracion' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /migraciones/lotes/{loteId}/conciliacion:
    get:
      tags: [Migración]
      operationId: obtenerConciliacion
      summary: Controles de cuadre entre el legado y el sistema nuevo
      x-modulo: migracion
      x-puerto-entrada: ConciliarLoteUseCase
      x-casos-uso: [CU-19]
      parameters:
        - $ref: '#/components/parameters/LoteId'
      responses:
        '200':
          description: Conciliación
          content:
            application/json:
              schema: { $ref: '../schemas/migracion.schema.json#/$defs/Conciliacion' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /migraciones/lotes/{loteId}/confirmacion:
    post:
      tags: [Migración]
      operationId: confirmarLote
      summary: Confirma el lote, crea movimientos y saldos y sella el linaje
      x-modulo: migracion
      x-puerto-entrada: ConfirmarLoteUseCase
      x-casos-uso: [CU-19]
      x-reglas: [MIG-09, MIG-10, MIG-11, MIG-12]
      x-roles: [GERENTE, CONTADOR]
      parameters:
        - $ref: '#/components/parameters/LoteId'
      responses:
        '202':
          description: Confirmación en curso
          content:
            application/json:
              schema: { $ref: '../schemas/migracion.schema.json#/$defs/LoteMigracion' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: La conciliación no es conforme o hay registros observados sin resolver
          content:
            application/problem+json:
              schema: { $ref: '../schemas/problema.schema.json' }

  /migraciones/linaje:
    get:
      tags: [Migración]
      operationId: consultarLinaje
      summary: Traza un registro legado hasta su entidad nueva, o una entidad hasta su origen
      x-modulo: migracion
      x-puerto-entrada: ConsultarLinajeUseCase
      x-casos-uso: [CU-19]
      parameters:
        - name: idLegado
          in: query
          schema: { type: string }
        - name: entidad
          in: query
          schema: { type: string, enum: [MovimientoInventario, Producto, DocumentoHistorico] }
        - name: entidadId
          in: query
          schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
      responses:
        '200':
          description: Vínculos de linaje
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../schemas/migracion.schema.json#/$defs/Linaje' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /auditoria/eventos:
    get:
      tags: [Sistema]
      operationId: consultarAuditoria
      summary: Bitácora de auditoría (quién hizo qué y cuándo)
      x-modulo: seguridad
      x-puerto-entrada: ConsultarAuditoriaUseCase
      x-casos-uso: [CU-28]
      x-roles: [ADMINISTRADOR, CONTADOR, GERENTE]
      parameters:
        - name: entidad
          in: query
          schema: { type: string }
        - name: entidadId
          in: query
          schema: { type: string }
        - name: usuario
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de eventos de auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /sistema/salud:
    get:
      tags: [Sistema]
      operationId: obtenerSalud
      summary: Estado del servidor, la base de datos, el canal de envío, el certificado y la cola de envíos
      security: []
      x-modulo: plataforma
      responses:
        '200':
          description: Estado de salud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

  /sistema/version-cliente:
    get:
      tags: [Sistema]
      operationId: obtenerVersionCliente
      summary: Versión mínima y vigente del instalador MSI o del APK
      security: []
      x-modulo: plataforma
      x-casos-uso: [CU-29]
      parameters:
        - name: plataforma
          in: query
          required: true
          schema: { type: string, enum: [WINDOWS, ANDROID] }
      responses:
        '200':
          description: Información de versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionCliente' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT firmado por el servidor; incluye usuario, roles y puntoEmisionId del dispositivo.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente por cada intento lógico de venta. Reintentos con la misma clave devuelven el mismo comprobante.
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamano:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Desde:
      name: desde
      in: query
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
    Hasta:
      name: hasta
      in: query
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
    Periodo:
      name: periodo
      in: query
      required: true
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Periodo' }
    ComprobanteId:
      name: comprobanteId
      in: path
      required: true
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
    ProductoId:
      name: productoId
      in: path
      required: true
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
    LoteId:
      name: loteId
      in: path
      required: true
      schema: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }

  headers:
    Location:
      description: URL del recurso creado
      schema: { type: string, format: uri-reference }
    ETag:
      description: Versión del recurso para concurrencia optimista
      schema: { type: string }

  responses:
    '401':
      description: Falta el token o expiró
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    '403':
      description: El rol del usuario no permite la operación
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    SolicitudInvalida:
      description: El cuerpo no cumple el contrato (VAL-EST-01)
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    NoAutenticado:
      description: Falta el token o expiró
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    Prohibido:
      description: El rol del usuario no permite la operación
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    NoEncontrado:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    Conflicto:
      description: Conflicto con el estado actual (duplicado, serie inactiva, clave de idempotencia reutilizada con otro cuerpo)
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    PrecondicionFallida:
      description: El ETag no coincide; otro usuario modificó el recurso
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    ReglaDeNegocio:
      description: El contrato es correcto pero viola reglas de negocio o normativas (VAL-*)
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
          example:
            type: /problemas/validacion-negocio
            title: El comprobante no cumple las reglas de emisión
            status: 422
            detail: La boleta supera S/ 700 y el adquirente no está identificado.
            errores:
              - regla: VAL-BOL-01
                campo: /cliente/numeroDocumento
                mensaje: Para boletas mayores a S/ 700 se requiere el tipo y número de documento del adquirente.
                severidad: ERROR
                fuenteNormativa: RS 097-2012/SUNAT, Anexo N.° 2 (modif. RS 114-2019/SUNAT), campo 11
    DemasiadasSolicitudes:
      description: Límite de solicitudes excedido; reintentar luego de Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }
    ServicioNoDisponible:
      description: Dependencia externa no disponible (padrón RUC, OSE/SUNAT); reintentar más tarde
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '../schemas/problema.schema.json' }

  schemas:
    TokenRequest:
      type: object
      additionalProperties: false
      required: [usuario, clave, dispositivoId, plataforma, versionCliente]
      properties:
        usuario: { type: string, minLength: 3, maxLength: 50 }
        clave: { type: string, format: password, writeOnly: true }
        dispositivoId: { type: string, description: 'Identificador del equipo registrado (caja, PC o móvil).' }
        plataforma: { type: string, enum: [WINDOWS, ANDROID] }
        versionCliente: { type: string, pattern: '^\d+\.\d+\.\d+$' }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiraEn, usuario, roles]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEn: { type: integer, description: Segundos de vida del accessToken }
        usuario: { type: string }
        roles:
          type: array
          items: { type: string, enum: [ADMINISTRADOR, CAJERO, VENDEDOR, ALMACENERO, CONTADOR, GERENTE] }
        puntoEmisionId: { type: string }
        almacenId: { type: string }
    Empresa:
      type: object
      required: [ruc, razonSocial, establecimientos]
      properties:
        ruc: { $ref: '../schemas/comun.schema.json#/$defs/Ruc' }
        razonSocial: { type: string }
        nombreComercial: { type: string }
        establecimientos:
          type: array
          items:
            type: object
            required: [codigo, direccion, ubigeo]
            properties:
              codigo: { $ref: '../schemas/comun.schema.json#/$defs/CodigoEstablecimiento' }
              direccion: { type: string }
              ubigeo: { $ref: '../schemas/comun.schema.json#/$defs/Ubigeo' }
              beneficios:
                type: array
                description: Beneficios tributarios del establecimiento, p. ej. AMAZONIA (Ley 27037), que activan la leyenda 2001.
                items: { type: string, enum: [AMAZONIA] }
    SerieRequest:
      type: object
      additionalProperties: false
      required: [codigo, tipoComprobante, puntoEmisionId]
      properties:
        codigo: { $ref: '../schemas/comun.schema.json#/$defs/Serie' }
        tipoComprobante: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Cat01ComprobanteEmitible' }
        puntoEmisionId: { type: string }
        codigoEstablecimiento: { $ref: '../schemas/comun.schema.json#/$defs/CodigoEstablecimiento' }
    Serie:
      allOf:
        - $ref: '#/components/schemas/SerieRequest'
        - type: object
          required: [ultimoCorrelativo, activa]
          properties:
            ultimoCorrelativo: { type: integer, minimum: 0, maximum: 99999999 }
            activa: { type: boolean }
    CertificadoInfo:
      type: object
      required: [huellaSha256, sujeto, emisor, vigenteDesde, vigenteHasta]
      properties:
        huellaSha256: { type: string }
        sujeto: { type: string }
        emisor: { type: string }
        numeroSerie: { type: string }
        vigenteDesde: { $ref: '../schemas/comun.schema.json#/$defs/FechaHora' }
        vigenteHasta: { $ref: '../schemas/comun.schema.json#/$defs/FechaHora' }
        diasParaVencer: { type: integer }
    CanalEnvioRequest:
      type: object
      additionalProperties: false
      required: [tipo, ambiente, urlServicio, usuario, clave]
      properties:
        tipo: { type: string, enum: [OSE, SUNAT] }
        ambiente: { type: string, enum: [BETA, PRODUCCION] }
        urlServicio:
          type: string
          format: uri
          examples: ['https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService']
        usuario: { type: string, description: RUC + usuario SOL secundario (o usuario del OSE). }
        clave: { type: string, format: password, writeOnly: true }
    CanalEnvio:
      type: object
      required: [tipo, ambiente, urlServicio, conexionVerificada]
      properties:
        tipo: { type: string, enum: [OSE, SUNAT] }
        ambiente: { type: string, enum: [BETA, PRODUCCION] }
        urlServicio: { type: string, format: uri }
        conexionVerificada: { type: boolean }
        verificadoEn: { $ref: '../schemas/comun.schema.json#/$defs/FechaHora' }
    Catalogo:
      type: object
      required: [numero, nombre, version, items]
      properties:
        numero: { type: string }
        nombre: { type: string }
        version: { type: string }
        fuente: { type: string, examples: ['RS 097-2012/SUNAT, Anexo N.° 8'] }
        items:
          type: array
          items:
            type: object
            required: [codigo, descripcion, vigenteDesde]
            properties:
              codigo: { type: string }
              descripcion: { type: string }
              atributos:
                type: object
                additionalProperties: { type: string }
              vigenteDesde: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
              vigenteHasta: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
    ParametroTributario:
      type: object
      required: [clave, valor, vigenteDesde, baseLegal]
      properties:
        clave:
          type: string
          enum: [TASA_IGV, TARIFA_ICBPER, UMBRAL_IDENTIFICACION_BOLETA, PLAZO_ENVIO_DIAS, PLAZO_BAJA_DIAS, UMBRAL_DETRACCION, FACTOR_ISC_PVP]
        valor: { type: string }
        vigenteDesde: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
        vigenteHasta: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
        baseLegal: { type: string }
    PaginaTerceros:
      type: object
      required: [elementos, pagina]
      properties:
        elementos:
          type: array
          items: { $ref: '../schemas/tercero.schema.json#/$defs/Tercero' }
        pagina: { $ref: '../schemas/comun.schema.json#/$defs/PaginaMeta' }
    PaginaMovimientos:
      type: object
      required: [elementos, pagina]
      properties:
        elementos:
          type: array
          items: { $ref: '../schemas/inventario.schema.json#/$defs/MovimientoInventario' }
        pagina: { $ref: '../schemas/comun.schema.json#/$defs/PaginaMeta' }
    PaginaRegistrosMigracion:
      type: object
      required: [elementos, pagina]
      properties:
        elementos:
          type: array
          items: { $ref: '../schemas/migracion.schema.json#/$defs/RegistroMigracion' }
        pagina: { $ref: '../schemas/comun.schema.json#/$defs/PaginaMeta' }
    ProcesoAceptado:
      type: object
      required: [procesoId, estado]
      properties:
        procesoId: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
        estado: { type: string, enum: [ENCOLADO, EN_PROCESO, TERMINADO, FALLIDO] }
        enlaces: { $ref: '../schemas/comun.schema.json#/$defs/Enlaces' }
    NotificacionRequest:
      type: object
      additionalProperties: false
      required: [canal]
      properties:
        canal: { type: string, enum: [CORREO, WHATSAPP] }
        destino: { type: string, description: 'Correo o número; si se omite, se usa el del cliente.' }
    LineaRegistroVentas:
      type: object
      description: Una fila del Formato 14.1 (RS 234-2006/SUNAT); en el SIRE corresponde a la propuesta del RVIE.
      required: [cuo, fechaEmision, tipoComprobante, serie, numero, importeTotal, moneda]
      properties:
        cuo: { type: string, description: Código único de la operación }
        fechaEmision: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
        fechaVencimiento: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
        tipoComprobante: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Tabla10TipoDocumento' }
        serie: { type: string }
        numero: { type: string }
        tipoDocumentoCliente: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Tabla2TipoDocumentoIdentidad' }
        numeroDocumentoCliente: { type: string }
        razonSocialCliente: { type: string }
        valorExportacion: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        baseImponibleGravada: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        importeExonerado: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        importeInafecto: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        isc: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        igv: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        icbper: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        otrosTributos: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        importeTotal: { $ref: '../schemas/comun.schema.json#/$defs/Importe' }
        moneda: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Cat02Moneda' }
        tipoCambio: { $ref: '../schemas/comun.schema.json#/$defs/TipoCambio' }
        referencia:
          type: object
          description: Comprobante que se modifica (solo notas)
          properties:
            fecha: { $ref: '../schemas/comun.schema.json#/$defs/Fecha' }
            tipo: { $ref: '../schemas/catalogos-sunat.schema.json#/$defs/Tabla10TipoDocumento' }
            serie: { type: string }
            numero: { type: string }
    EventoAuditoria:
      type: object
      required: [id, fechaHora, usuario, accion, entidad, entidadId]
      properties:
        id: { $ref: '../schemas/comun.schema.json#/$defs/Uuid' }
        fechaHora: { $ref: '../schemas/comun.schema.json#/$defs/FechaHora' }
        usuario: { type: string }
        dispositivoId: { type: string }
        accion: { type: string, examples: [EMITIR, ANULAR, MODIFICAR_PRODUCTO, CONFIRMAR_LOTE] }
        entidad: { type: string }
        entidadId: { type: string }
        antes: { type: object }
        despues: { type: object }
        correlationId: { type: string }
    PaginaAuditoria:
      type: object
      required: [elementos, pagina]
      properties:
        elementos:
          type: array
          items: { $ref: '#/components/schemas/EventoAuditoria' }
        pagina: { $ref: '../schemas/comun.schema.json#/$defs/PaginaMeta' }
    Salud:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [OPERATIVO, DEGRADADO, CAIDO] }
        baseDatos: { type: string, enum: [OK, ERROR] }
        canalEnvio: { type: string, enum: [OK, LENTO, CAIDO] }
        certificadoDiasParaVencer: { type: integer }
        colaEnvio:
          type: object
          properties:
            pendientes: { type: integer, minimum: 0 }
            antiguedadMaximaMinutos: { type: integer, minimum: 0 }
    VersionCliente:
      type: object
      required: [plataforma, versionMinima, versionVigente, urlDescarga, sha256]
      properties:
        plataforma: { type: string, enum: [WINDOWS, ANDROID] }
        versionMinima: { type: string }
        versionVigente: { type: string }
        urlDescarga: { type: string, format: uri-reference }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
