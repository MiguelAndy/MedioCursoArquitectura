        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
    post:
      tags: [Comprobantes]
      operationId: emitirComprobante
      summary: Emite una factura, boleta, nota de crédito o nota de débito electrónica
      description: |
        Flujo síncrono (< 1,5 s): valida, calcula, asigna el correlativo de forma atómica, genera el XML UBL 2.1,
        lo firma y lo persiste con estado EMITIDO. Devuelve el hash y el QR para imprimir de inmediato.
        El envío a OSE/SUNAT es asíncrono (outbox + reintentos, ADR-05); el estado final se consulta en el recurso.
      x-modulo: facturacion
      x-puerto-entrada: EmitirComprobanteUseCase
      x-casos-uso: [CU-01, CU-02, CU-03, CU-04, CU-07]
      x-reglas: [VAL-EST-01, VAL-EST-02, VAL-EST-03, VAL-ID-01, VAL-ID-02, VAL-ID-03, VAL-ID-04, VAL-ID-05, VAL-BOL-01, VAL-BOL-02, VAL-NUM-01, VAL-NUM-02, VAL-NUM-03, VAL-NUM-04, VAL-FEC-01, VAL-FEC-02, VAL-FEC-03, VAL-MON-01, VAL-MON-02, VAL-ITM-01, VAL-ITM-02, VAL-ITM-03, VAL-ITM-04, VAL-ITM-05, VAL-ITM-06, VAL-TRB-01, VAL-TRB-02, VAL-TRB-03, VAL-TRB-04, VAL-TRB-05, VAL-TRB-06, VAL-TRB-07, VAL-TRB-08, VAL-TRB-09, VAL-TOT-01, VAL-TOT-02, VAL-TOT-03, VAL-TOT-04, VAL-TOT-05, VAL-TOT-06, VAL-PAG-01, VAL-PAG-02, VAL-PAG-03, VAL-PAG-04, VAL-NOT-01, VAL-NOT-02, VAL-NOT-03, VAL-NOT-04, VAL-NOT-05, VAL-DET-01, VAL-ENV-02]
      x-roles: [CAJERO, VENDEDOR, CONTADOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/comprobante-emision.request.schema.json' }
            examples:
              facturaCredito:
                summary: Factura mayorista al crédito con bonificación (F001-1)
                externalValue: ../ejemplos/json/01-emitir-factura-credito.request.json
              boletaIcbper:
                summary: Boleta con exonerado e ICBPER (B001-1)
                externalValue: ../ejemplos/json/02-emitir-boleta-icbper.request.json
              facturaIsc:
                summary: Factura con ISC, Catálogo N.° 08 sistema 01 (F001-2)
                externalValue: ../ejemplos/json/03-emitir-factura-isc.request.json
              notaCredito:
                summary: Nota de crédito por devolución de un ítem (FC01-1)
                externalValue: ../ejemplos/json/04-emitir-nota-credito.request.json
      responses:
        '200':
          description: Reintento idempotente; se devuelve el comprobante ya emitido con la misma Idempotency-Key
          content:
            application/json:
              schema: { $ref: '../schemas/comprobante.response.schema.json' }
        '201':
          description: Comprobante emitido (numerado y firmado); envío a OSE/SUNAT en curso
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../schemas/comprobante.response.schema.json' }
              examples:
                emitido:
                  externalValue: ../ejemplos/json/05-comprobante-emitido.response.json
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

