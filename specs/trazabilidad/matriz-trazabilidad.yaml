# Matriz de trazabilidad normativa (fuente única).
# tools/generar_matrices.py la convierte en: specs/trazabilidad/matriz-trazabilidad.xlsx, specs/trazabilidad/csv/*.csv
# y en las tablas de docs/08-matriz-trazabilidad-normativa.md. La columna "Card. XSD" NO se escribe a mano:
# el generador la calcula leyendo specs/ubl/xsd-oasis-ubl-2.1 (UBL-Invoice/CreditNote/DebitNote-2.1.xsd).
version: 1.1.0
fuentes:
  A: "RS 097-2012/SUNAT, Anexo N.° 9-A Estándar UBL 2.1, a) Factura electrónica (incorporado por RS 114-2019/SUNAT); RS 150-2019/SUNAT (ICBPER); RS 193-2020/SUNAT (forma de pago); Anexo N.° 8 (catálogos)"
  N: "RS 097-2012/SUNAT, anexos de nota de crédito y débito (estándar UBL 2.1); Catálogos N.° 09 y 10"
  B: "RS 234-2006/SUNAT, Formato 14.1 Registro de Ventas e Ingresos (y RVIE del SIRE)"
  C: "RS 234-2006/SUNAT, Formato 12.1 Registro del Inventario Permanente en Unidades Físicas; Tablas 5, 6, 10 y 12"

# Matriz A - Factura y boleta (raíz Invoice): dato SUNAT <-> UBL 2.1 <-> DTO <-> dominio <-> reglas
matriz_a:
  - {id: TR-A01, campo: "1", dato: "Versión del UBL", cond: M, cat: "", xpath: "/Invoice/cbc:UBLVersionID = \"2.1\"", xsd: /Invoice/cbc:UBLVersionID, dto: "(constante del generador UBL)", dominio: DocumentoElectronico, reglas: [VAL-EST-03]}
  - {id: TR-A02, campo: "2", dato: "Versión de la estructura del documento", cond: M, cat: "", xpath: "/Invoice/cbc:CustomizationID = \"2.0\"", xsd: /Invoice/cbc:CustomizationID, dto: "(constante del generador UBL)", dominio: DocumentoElectronico, reglas: [VAL-EST-03]}
  - {id: TR-A03, campo: "3", dato: "Numeración: serie y número correlativo", cond: M, cat: "", xpath: /Invoice/cbc:ID, xsd: /Invoice/cbc:ID, dto: "serie (solicitud); numero (respuesta)", dominio: Comprobante.numero, reglas: [VAL-NUM-01, VAL-NUM-02]}
  - {id: TR-A04, campo: "4", dato: "Fecha de emisión", cond: M, cat: "", xpath: /Invoice/cbc:IssueDate, xsd: /Invoice/cbc:IssueDate, dto: fechaEmision, dominio: Comprobante.fechaEmision, reglas: [VAL-FEC-01, VAL-FEC-02]}
  - {id: TR-A05, campo: "5", dato: "Hora de emisión", cond: C, cat: "", xpath: /Invoice/cbc:IssueTime, xsd: /Invoice/cbc:IssueTime, dto: horaEmision, dominio: Comprobante.horaEmision, reglas: []}
  - {id: TR-A06, campo: "6", dato: "Tipo de documento", cond: M, cat: "01", xpath: /Invoice/cbc:InvoiceTypeCode, xsd: /Invoice/cbc:InvoiceTypeCode, dto: tipoComprobante, dominio: Comprobante.tipo, reglas: [VAL-EST-01]}
  - {id: TR-A07, campo: "58", dato: "Tipo de operación", cond: M, cat: "51", xpath: /Invoice/cbc:InvoiceTypeCode/@listID, xsd: /Invoice/cbc:InvoiceTypeCode, dto: tipoOperacion, dominio: Comprobante.tipoOperacion, reglas: [VAL-ID-03, VAL-ID-05, VAL-DET-01]}
  - {id: TR-A08, campo: "7", dato: "Tipo de moneda", cond: M, cat: "02", xpath: "/Invoice/cbc:DocumentCurrencyCode (y @currencyID de cada importe)", xsd: /Invoice/cbc:DocumentCurrencyCode, dto: moneda, dominio: Comprobante.moneda, reglas: [VAL-MON-01, VAL-MON-02]}
  - {id: TR-A09, campo: "8", dato: "Fecha de vencimiento", cond: C, cat: "", xpath: /Invoice/cbc:DueDate, xsd: /Invoice/cbc:DueDate, dto: fechaVencimiento, dominio: Comprobante.fechaVencimiento, reglas: [VAL-FEC-03]}
  - {id: TR-A10, campo: "9", dato: "Firma digital", cond: M, cat: "", xpath: "/Invoice/ext:UBLExtensions/ext:UBLExtension/ext:ExtensionContent/ds:Signature y /Invoice/cac:Signature", xsd: /Invoice/ext:UBLExtensions/ext:UBLExtension/ext:ExtensionContent/ds:Signature, dto: "documentoElectronico.hash (respuesta)", dominio: DocumentoElectronico.hash, reglas: [VAL-ENV-02, VAL-EST-02]}
  - {id: TR-A11, campo: "10", dato: "Número de RUC del emisor (tipo 6)", cond: M, cat: "06", xpath: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyIdentification/cbc:ID/@schemeID, xsd: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyIdentification/cbc:ID, dto: "emisor.ruc (respuesta)", dominio: Empresa.ruc, reglas: [VAL-ID-02]}
  - {id: TR-A12, campo: "11", dato: "Nombre comercial del emisor", cond: C, cat: "", xpath: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyName/cbc:Name, xsd: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyName/cbc:Name, dto: emisor.nombreComercial, dominio: Empresa.nombreComercial, reglas: []}
  - {id: TR-A13, campo: "12", dato: "Razón social del emisor", cond: M, cat: "", xpath: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName, xsd: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName, dto: emisor.razonSocial, dominio: Empresa.razonSocial, reglas: []}
  - {id: TR-A14, campo: "13", dato: "Domicilio fiscal (ubigeo y dirección)", cond: C, cat: "13", xpath: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cbc:ID, xsd: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cbc:ID, dto: "emisor.ubigeo, emisor.direccion", dominio: Establecimiento, reglas: []}
  - {id: TR-A15, campo: "16", dato: "Código del domicilio fiscal o del establecimiento anexo", cond: M, cat: "", xpath: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cbc:AddressTypeCode, xsd: /Invoice/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cbc:AddressTypeCode, dto: emisor.codigoEstablecimiento, dominio: Establecimiento.codigo, reglas: [VAL-EST-03]}
  - {id: TR-A16, campo: "17", dato: "Tipo y número de documento del adquirente", cond: M, cat: "06", xpath: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyIdentification/cbc:ID/@schemeID, xsd: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyIdentification/cbc:ID, dto: "cliente.tipoDocumento, cliente.numeroDocumento", dominio: Adquirente.documento, reglas: [VAL-ID-01, VAL-ID-02, VAL-ID-03, VAL-ID-06, VAL-BOL-01]}
  - {id: TR-A17, campo: "18", dato: "Razón social o nombre del adquirente", cond: M, cat: "", xpath: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName, xsd: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName, dto: cliente.razonSocial, dominio: Adquirente.razonSocial, reglas: [VAL-ID-04]}
  - {id: TR-A18, campo: "19", dato: "Dirección del adquirente", cond: C, cat: "13", xpath: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cac:AddressLine/cbc:Line, xsd: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cac:RegistrationAddress/cac:AddressLine/cbc:Line, dto: "cliente.direccion, cliente.ubigeo", dominio: Adquirente.direccion, reglas: []}
  - {id: TR-A19, campo: "22", dato: "Guía de remisión relacionada", cond: C, cat: "01", xpath: /Invoice/cac:DespatchDocumentReference/cbc:ID (+ cbc:DocumentTypeCode), xsd: /Invoice/cac:DespatchDocumentReference/cbc:ID, dto: "guiasRemision[].numero, .tipo", dominio: Comprobante.guias, reglas: [VAL-BOL-02]}
  - {id: TR-A20, campo: "59", dato: "Número de la orden de compra", cond: C, cat: "", xpath: /Invoice/cac:OrderReference/cbc:ID, xsd: /Invoice/cac:OrderReference/cbc:ID, dto: ordenCompra, dominio: Comprobante.ordenCompra, reglas: []}
  - {id: TR-A21, campo: "57", dato: "Leyendas (monto en letras, transferencia gratuita, etc.)", cond: C, cat: "52", xpath: /Invoice/cbc:Note/@languageLocaleID, xsd: /Invoice/cbc:Note, dto: "leyendas[] (respuesta)", dominio: Comprobante.leyendas, reglas: [VAL-TOT-06, VAL-ITM-04]}
  - {id: TR-A22, campo: "RS 193-2020", dato: "Forma de pago (Contado / Credito)", cond: M, cat: "", xpath: "/Invoice/cac:PaymentTerms[cbc:ID='FormaPago']/cbc:PaymentMeansID", xsd: /Invoice/cac:PaymentTerms/cbc:PaymentMeansID, dto: formaPago.tipo, dominio: FormaPago.tipo, reglas: [VAL-PAG-01]}
  - {id: TR-A23, campo: "RS 193-2020", dato: "Monto neto pendiente de pago", cond: C, cat: "", xpath: "/Invoice/cac:PaymentTerms[cbc:PaymentMeansID='Credito']/cbc:Amount", xsd: /Invoice/cac:PaymentTerms/cbc:Amount, dto: formaPago.montoPendiente, dominio: FormaPago.montoPendiente, reglas: [VAL-PAG-02]}
  - {id: TR-A24, campo: "RS 193-2020", dato: "Cuotas: monto y fecha de vencimiento", cond: C, cat: "", xpath: "/Invoice/cac:PaymentTerms[cbc:PaymentMeansID='CuotaNNN']/cbc:Amount y cbc:PaymentDueDate", xsd: /Invoice/cac:PaymentTerms/cbc:PaymentDueDate, dto: "formaPago.cuotas[]", dominio: Cuota, reglas: [VAL-PAG-03, VAL-FEC-03]}
  - {id: TR-A25, campo: "Detracción", dato: "Bien o servicio, porcentaje, monto y cuenta del Banco de la Nación", cond: C, cat: "54, 59", xpath: "/Invoice/cac:PaymentMeans/cac:PayeeFinancialAccount/cbc:ID y /Invoice/cac:PaymentTerms[cbc:ID='Detraccion']", xsd: /Invoice/cac:PaymentMeans/cac:PayeeFinancialAccount/cbc:ID, dto: "detraccion.*", dominio: "Comprobante (fase 2)", reglas: [VAL-DET-01]}
  - {id: TR-A26, campo: "50", dato: "Cargos y descuentos globales", cond: C, cat: "53", xpath: "/Invoice/cac:AllowanceCharge (ChargeIndicator, AllowanceChargeReasonCode, MultiplierFactorNumeric, Amount, BaseAmount)", xsd: /Invoice/cac:AllowanceCharge/cbc:AllowanceChargeReasonCode, dto: "cargosDescuentosGlobales[]", dominio: CargoDescuento, reglas: [VAL-TOT-01, VAL-TOT-04]}
  - {id: TR-A27, campo: "40", dato: "Monto total de tributos", cond: M, cat: "", xpath: /Invoice/cac:TaxTotal/cbc:TaxAmount, xsd: /Invoice/cac:TaxTotal/cbc:TaxAmount, dto: totales.totalTributos, dominio: Totales, reglas: [VAL-TOT-02]}
  - {id: TR-A28, campo: "46-47", dato: "Total valor de venta de operaciones gravadas y sumatoria del IGV", cond: C, cat: "05 (1000)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=1000]/cbc:TaxableAmount y cbc:TaxAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount, dto: "totales.operacionesGravadas, totales.igv", dominio: "Totales.gravadas, Totales.igv", reglas: [VAL-TRB-01, VAL-TRB-08]}
  - {id: TR-A29, campo: "43", dato: "Total valor de venta de operaciones exoneradas", cond: C, cat: "05 (9997)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=9997]/cbc:TaxableAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount, dto: totales.operacionesExoneradas, dominio: Totales.exoneradas, reglas: [VAL-TRB-07]}
  - {id: TR-A30, campo: "42", dato: "Total valor de venta de operaciones inafectas", cond: C, cat: "05 (9998)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=9998]/cbc:TaxableAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount, dto: totales.operacionesInafectas, dominio: Totales.inafectas, reglas: [VAL-TRB-07]}
  - {id: TR-A31, campo: "41", dato: "Total valor de venta de exportación", cond: C, cat: "05 (9995)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=9995]/cbc:TaxableAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxableAmount, dto: totales.operacionesExportacion, dominio: Totales, reglas: [VAL-ITM-05]}
  - {id: TR-A32, campo: "44-45", dato: "Total valor de venta de operaciones gratuitas y sus tributos", cond: C, cat: "05 (9996)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=9996]/cbc:TaxableAmount y cbc:TaxAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount, dto: "totales.operacionesGratuitas, totales.tributosOperacionesGratuitas", dominio: Totales.gratuitas, reglas: [VAL-TRB-09, VAL-ITM-04]}
  - {id: TR-A33, campo: "48", dato: "Sumatoria del ISC", cond: C, cat: "05 (2000)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=2000]/cbc:TaxAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount, dto: totales.isc, dominio: Totales.isc, reglas: [VAL-TRB-03]}
  - {id: TR-A34, campo: "49", dato: "Sumatoria de otros tributos (ICBPER 7152, otros 9999)", cond: C, cat: "05 (7152, 9999)", xpath: "/Invoice/cac:TaxTotal/cac:TaxSubtotal[TaxScheme/ID=7152|9999]/cbc:TaxAmount", xsd: /Invoice/cac:TaxTotal/cac:TaxSubtotal/cbc:TaxAmount, dto: "totales.icbper, totales.otrosTributos", dominio: Totales.icbper, reglas: [VAL-TRB-06]}
  - {id: TR-A35, campo: "54", dato: "Total valor de venta", cond: M, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:LineExtensionAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:LineExtensionAmount, dto: totales.totalValorVenta, dominio: Totales, reglas: [VAL-TOT-01]}
  - {id: TR-A36, campo: "55", dato: "Total precio de venta (incluye impuestos)", cond: M, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount, dto: totales.totalPrecioVenta, dominio: Totales, reglas: [VAL-TOT-03]}
  - {id: TR-A37, campo: "51", dato: "Sumatoria de otros descuentos (no afectan la base del IGV)", cond: C, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:AllowanceTotalAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:AllowanceTotalAmount, dto: totales.descuentosNoAfectos, dominio: Totales, reglas: [VAL-TOT-04]}
  - {id: TR-A38, campo: "52", dato: "Sumatoria de otros cargos (no afectan la base del IGV)", cond: C, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount, dto: totales.cargosNoAfectos, dominio: Totales, reglas: [VAL-TOT-04]}
  - {id: TR-A39, campo: "66", dato: "Total de anticipos", cond: C, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:PrepaidAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:PrepaidAmount, dto: totales.anticipos, dominio: Totales, reglas: [VAL-TOT-04]}
  - {id: TR-A40, campo: "56", dato: "Monto de redondeo del importe total", cond: C, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:PayableRoundingAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:PayableRoundingAmount, dto: totales.redondeo, dominio: Totales, reglas: [VAL-TOT-04]}
  - {id: TR-A41, campo: "53", dato: "Importe total de la venta", cond: M, cat: "", xpath: /Invoice/cac:LegalMonetaryTotal/cbc:PayableAmount, xsd: /Invoice/cac:LegalMonetaryTotal/cbc:PayableAmount, dto: totales.importeTotal, dominio: Totales.importeTotal, reglas: [VAL-TOT-04, VAL-TOT-06]}
  - {id: TR-A42, campo: "24", dato: "Número de orden del ítem", cond: M, cat: "", xpath: /Invoice/cac:InvoiceLine/cbc:ID, xsd: /Invoice/cac:InvoiceLine/cbc:ID, dto: "items[].numeroOrden (respuesta)", dominio: LineaComprobante.numeroOrden, reglas: [VAL-ITM-01]}
  - {id: TR-A43, campo: "25-26", dato: "Unidad de medida y cantidad del ítem", cond: M, cat: "03", xpath: /Invoice/cac:InvoiceLine/cbc:InvoicedQuantity/@unitCode, xsd: /Invoice/cac:InvoiceLine/cbc:InvoicedQuantity, dto: "items[].unidadMedida, items[].cantidad", dominio: LineaComprobante.cantidad, reglas: [VAL-ITM-02, VAL-ITM-03, VAL-EST-03]}
  - {id: TR-A44, campo: "27", dato: "Código de producto", cond: C, cat: "", xpath: /Invoice/cac:InvoiceLine/cac:Item/cac:SellersItemIdentification/cbc:ID, xsd: /Invoice/cac:InvoiceLine/cac:Item/cac:SellersItemIdentification/cbc:ID, dto: "items[].codigoProducto", dominio: Producto.codigo, reglas: []}
  - {id: TR-A45, campo: "28", dato: "Código de producto SUNAT (UNSPSC)", cond: C, cat: "25", xpath: /Invoice/cac:InvoiceLine/cac:Item/cac:CommodityClassification/cbc:ItemClassificationCode, xsd: /Invoice/cac:InvoiceLine/cac:Item/cac:CommodityClassification/cbc:ItemClassificationCode, dto: "items[].codigoProductoSunat", dominio: Producto.codigoSunatUnspsc, reglas: []}
  - {id: TR-A46, campo: "29", dato: "Código de producto GTIN", cond: C, cat: "", xpath: /Invoice/cac:InvoiceLine/cac:Item/cac:StandardItemIdentification/cbc:ID, xsd: /Invoice/cac:InvoiceLine/cac:Item/cac:StandardItemIdentification/cbc:ID, dto: "items[].codigoGtin", dominio: Producto.gtin, reglas: []}
  - {id: TR-A47, campo: "31", dato: "Descripción del bien o servicio", cond: M, cat: "", xpath: /Invoice/cac:InvoiceLine/cac:Item/cbc:Description, xsd: /Invoice/cac:InvoiceLine/cac:Item/cbc:Description, dto: "items[].descripcion", dominio: LineaComprobante, reglas: [VAL-ITM-03]}
  - {id: TR-A48, campo: "32", dato: "Valor unitario por ítem (sin impuestos)", cond: M, cat: "", xpath: /Invoice/cac:InvoiceLine/cac:Price/cbc:PriceAmount, xsd: /Invoice/cac:InvoiceLine/cac:Price/cbc:PriceAmount, dto: "items[].valorUnitario", dominio: LineaComprobante.valorUnitario, reglas: [VAL-ITM-02, VAL-TRB-02]}
  - {id: TR-A49, campo: "33", dato: "Precio de venta unitario (tipo 01)", cond: M, cat: "16", xpath: /Invoice/cac:InvoiceLine/cac:PricingReference/cac:AlternativeConditionPrice/cbc:PriceAmount (+ cbc:PriceTypeCode), xsd: /Invoice/cac:InvoiceLine/cac:PricingReference/cac:AlternativeConditionPrice/cbc:PriceAmount, dto: "items[].precioUnitario", dominio: LineaComprobante.precioUnitario, reglas: [VAL-TRB-02]}
  - {id: TR-A50, campo: "34", dato: "Valor referencial unitario en operaciones no onerosas (tipo 02)", cond: C, cat: "16", xpath: "/Invoice/cac:InvoiceLine/cac:PricingReference/cac:AlternativeConditionPrice/cbc:PriceTypeCode = 02", xsd: /Invoice/cac:InvoiceLine/cac:PricingReference/cac:AlternativeConditionPrice/cbc:PriceTypeCode, dto: "items[].valorReferencialUnitario", dominio: LineaComprobante.valorReferencial, reglas: [VAL-ITM-04]}
  - {id: TR-A51, campo: "35", dato: "Monto total de tributos del ítem", cond: M, cat: "", xpath: /Invoice/cac:InvoiceLine/cac:TaxTotal/cbc:TaxAmount, xsd: /Invoice/cac:InvoiceLine/cac:TaxTotal/cbc:TaxAmount, dto: "items[].totalTributos", dominio: LineaComprobante, reglas: [VAL-TRB-08]}
  - {id: TR-A52, campo: "36", dato: "Afectación al IGV por ítem: base, monto, tasa y código", cond: M, cat: "07, 05", xpath: "/Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReasonCode (+ TaxableAmount, TaxAmount, Percent, TaxScheme/ID)", xsd: /Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TaxExemptionReasonCode, dto: "items[].tipoAfectacionIgv, baseImponibleIgv, montoIgv, porcentajeIgv, codigoTributoIgv", dominio: "LineaComprobante.afectacion, .igv", reglas: [VAL-TRB-01, VAL-TRB-05, VAL-TRB-07]}
  - {id: TR-A53, campo: "37", dato: "Afectación al ISC por ítem: sistema de cálculo (CATÁLOGO N.° 08), base, tasa y monto", cond: C, cat: "08, 05 (2000)", xpath: "/Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TierRange (+ TaxableAmount, TaxAmount, Percent)", xsd: /Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cac:TaxCategory/cbc:TierRange, dto: "items[].isc.sistema, isc.tasa, baseImponibleIsc, montoIsc", dominio: "Isc.sistema, Isc.monto", reglas: [VAL-TRB-03, VAL-TRB-04, VAL-TRB-05]}
  - {id: TR-A54, campo: "RS 150-2019", dato: "ICBPER por ítem: cantidad de bolsas, tarifa y monto", cond: C, cat: "05 (7152)", xpath: /Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cbc:BaseUnitMeasure (+ cac:TaxCategory/cbc:PerUnitAmount), xsd: /Invoice/cac:InvoiceLine/cac:TaxTotal/cac:TaxSubtotal/cbc:BaseUnitMeasure, dto: "items[].icbper.cantidadBolsas, tarifaIcbper, montoIcbper", dominio: Icbper, reglas: [VAL-TRB-06]}
  - {id: TR-A55, campo: "38", dato: "Valor de venta por ítem", cond: M, cat: "", xpath: /Invoice/cac:InvoiceLine/cbc:LineExtensionAmount, xsd: /Invoice/cac:InvoiceLine/cbc:LineExtensionAmount, dto: "items[].valorVenta", dominio: LineaComprobante.valorVenta, reglas: [VAL-TOT-01]}
  - {id: TR-A56, campo: "39", dato: "Cargo o descuento por ítem", cond: C, cat: "53", xpath: "/Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:AllowanceChargeReasonCode (+ MultiplierFactorNumeric, Amount, BaseAmount)", xsd: /Invoice/cac:InvoiceLine/cac:AllowanceCharge/cbc:AllowanceChargeReasonCode, dto: "items[].cargosDescuentos[]", dominio: CargoDescuento, reglas: [VAL-TOT-01]}

# Matriz A2 - Notas de crédito (CreditNote) y débito (DebitNote)
matriz_notas:
  - {id: TR-N01, dato: "Serie y número de la nota (letra según el comprobante modificado)", cond: M, cat: "", xpath: /CreditNote/cbc:ID, xsd: /CreditNote/cbc:ID, dto: "serie; numero", reglas: [VAL-NUM-01, VAL-NUM-03]}
  - {id: TR-N02, dato: "Tipo de nota de crédito (motivo)", cond: M, cat: "09", xpath: /CreditNote/cac:DiscrepancyResponse/cbc:ResponseCode, xsd: /CreditNote/cac:DiscrepancyResponse/cbc:ResponseCode, dto: documentoReferencia.motivo, reglas: [VAL-NOT-03]}
  - {id: TR-N03, dato: "Sustento del motivo", cond: M, cat: "", xpath: /CreditNote/cac:DiscrepancyResponse/cbc:Description, xsd: /CreditNote/cac:DiscrepancyResponse/cbc:Description, dto: documentoReferencia.sustento, reglas: [VAL-NOT-03]}
  - {id: TR-N04, dato: "Serie y número del comprobante que se modifica", cond: M, cat: "", xpath: /CreditNote/cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID (y DiscrepancyResponse/cbc:ReferenceID), xsd: /CreditNote/cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID, dto: documentoReferencia.numero, reglas: [VAL-NOT-01, VAL-NOT-02]}
  - {id: TR-N05, dato: "Tipo del comprobante que se modifica", cond: M, cat: "01", xpath: /CreditNote/cac:BillingReference/cac:InvoiceDocumentReference/cbc:DocumentTypeCode, xsd: /CreditNote/cac:BillingReference/cac:InvoiceDocumentReference/cbc:DocumentTypeCode, dto: documentoReferencia.tipoComprobante, reglas: [VAL-NOT-02, VAL-NOT-04]}
  - {id: TR-N06, dato: "Cantidad acreditada por ítem", cond: M, cat: "03", xpath: /CreditNote/cac:CreditNoteLine/cbc:CreditedQuantity/@unitCode, xsd: /CreditNote/cac:CreditNoteLine/cbc:CreditedQuantity, dto: "items[].cantidad, items[].unidadMedida", reglas: [VAL-NOT-05, VAL-NOT-06]}
  - {id: TR-N07, dato: "Importe total de la nota de crédito", cond: M, cat: "", xpath: /CreditNote/cac:LegalMonetaryTotal/cbc:PayableAmount, xsd: /CreditNote/cac:LegalMonetaryTotal/cbc:PayableAmount, dto: totales.importeTotal, reglas: [VAL-NOT-05]}
  - {id: TR-N08, dato: "Tipo de nota de débito (motivo)", cond: M, cat: "10", xpath: /DebitNote/cac:DiscrepancyResponse/cbc:ResponseCode, xsd: /DebitNote/cac:DiscrepancyResponse/cbc:ResponseCode, dto: documentoReferencia.motivo, reglas: [VAL-NOT-03]}
  - {id: TR-N09, dato: "Importe total de la nota de débito", cond: M, cat: "", xpath: /DebitNote/cac:RequestedMonetaryTotal/cbc:PayableAmount, xsd: /DebitNote/cac:RequestedMonetaryTotal/cbc:PayableAmount, dto: totales.importeTotal, reglas: [VAL-TOT-04]}

# Matriz B - Registro de Ventas e Ingresos (Formato 14.1 / RVIE) <-> UBL 2.1 <-> DTO
matriz_b:
  - {id: TR-B01, columna: "Número correlativo del registro o CUO", tabla: "", ubl: "(lo genera el módulo registros)", dto: cuo}
  - {id: TR-B02, columna: "Fecha de emisión del comprobante", tabla: "", ubl: /Invoice/cbc:IssueDate, dto: fechaEmision}
  - {id: TR-B03, columna: "Fecha de vencimiento y/o pago", tabla: "", ubl: "/Invoice/cbc:DueDate (o la PaymentDueDate de la última cuota)", dto: fechaVencimiento}
  - {id: TR-B04, columna: "Tipo de comprobante de pago", tabla: "Tabla 10", ubl: "/Invoice/cbc:InvoiceTypeCode (01, 03); raíz CreditNote = 07; DebitNote = 08", dto: tipoComprobante}
  - {id: TR-B05, columna: "Número de serie", tabla: "", ubl: "substring-before(/Invoice/cbc:ID, '-')", dto: serie}
  - {id: TR-B06, columna: "Número del comprobante", tabla: "", ubl: "substring-after(/Invoice/cbc:ID, '-')", dto: numero}
  - {id: TR-B07, columna: "Tipo de documento de identidad del cliente", tabla: "Tabla 2", ubl: "/Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyIdentification/cbc:ID/@schemeID (Cat. 06; códigos 0, 1, 4, 6, 7 y A coinciden con la Tabla 2)", dto: tipoDocumentoCliente}
  - {id: TR-B08, columna: "Número de documento del cliente", tabla: "", ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyIdentification/cbc:ID, dto: numeroDocumentoCliente}
  - {id: TR-B09, columna: "Apellidos y nombres, denominación o razón social", tabla: "", ubl: /Invoice/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName, dto: razonSocialCliente}
  - {id: TR-B10, columna: "Valor facturado de la exportación", tabla: "", ubl: "TaxSubtotal 9995 / cbc:TaxableAmount", dto: valorExportacion}
  - {id: TR-B11, columna: "Base imponible de la operación gravada", tabla: "", ubl: "TaxSubtotal 1000 / cbc:TaxableAmount", dto: baseImponibleGravada}
  - {id: TR-B12, columna: "Importe total de la operación exonerada", tabla: "", ubl: "TaxSubtotal 9997 / cbc:TaxableAmount", dto: importeExonerado}
  - {id: TR-B13, columna: "Importe total de la operación inafecta", tabla: "", ubl: "TaxSubtotal 9998 / cbc:TaxableAmount", dto: importeInafecto}
  - {id: TR-B14, columna: "ISC", tabla: "", ubl: "TaxSubtotal 2000 / cbc:TaxAmount", dto: isc}
  - {id: TR-B15, columna: "IGV y/o IPM", tabla: "", ubl: "TaxSubtotal 1000 / cbc:TaxAmount", dto: igv}
  - {id: TR-B16, columna: "ICBPER (columna incorporada posteriormente en PLE / RVIE)", tabla: "", ubl: "TaxSubtotal 7152 / cbc:TaxAmount", dto: icbper}
  - {id: TR-B17, columna: "Otros tributos y cargos que no forman parte de la base imponible", tabla: "", ubl: "TaxSubtotal 9999 / cbc:TaxAmount + LegalMonetaryTotal/cbc:ChargeTotalAmount", dto: otrosTributos}
  - {id: TR-B18, columna: "Importe total del comprobante", tabla: "", ubl: /Invoice/cac:LegalMonetaryTotal/cbc:PayableAmount, dto: importeTotal}
  - {id: TR-B19, columna: "Tipo de cambio", tabla: "", ubl: "(no se informa en el XML de venta interna; proviene del comprobante: tipoCambio)", dto: tipoCambio}
  - {id: TR-B20, columna: "Referencia del comprobante modificado: fecha, tipo, serie y número", tabla: "Tabla 10", ubl: "/CreditNote/cac:BillingReference/cac:InvoiceDocumentReference/cbc:ID y cbc:DocumentTypeCode", dto: "referencia.fecha, .tipo, .serie, .numero"}

# Matriz C - Formato 12.1 <-> dominio <-> ficha del legado
matriz_c:
  - {id: TR-C01, columna: "Periodo", tabla: "", dominio: "MovimientoInventario.fecha (AAAA-MM)", legado: fecha, regla: MIG-01}
  - {id: TR-C02, columna: "RUC", tabla: "", dominio: Empresa.ruc, legado: "—", regla: ""}
  - {id: TR-C03, columna: "Apellidos y nombres, denominación o razón social", tabla: "", dominio: Empresa.razonSocial, legado: "—", regla: ""}
  - {id: TR-C04, columna: "Establecimiento", tabla: "", dominio: Almacen.codigoEstablecimiento, legado: "(parámetro del lote: almacenId)", regla: ""}
  - {id: TR-C05, columna: "Código de la existencia", tabla: "", dominio: Producto.codigo, legado: producto, regla: MIG-03}
  - {id: TR-C06, columna: "Tipo de existencia", tabla: "Tabla 5", dominio: Producto.tipoExistencia, legado: "— (por defecto 01 Mercadería)", regla: MIG-07}
  - {id: TR-C07, columna: "Descripción", tabla: "", dominio: Producto.descripcion, legado: producto, regla: MIG-03}
  - {id: TR-C08, columna: "Código de la unidad de medida", tabla: "Tabla 6", dominio: "Producto.unidadBase (Cat. 03 → Tabla 6)", legado: "— (por defecto 07 Unidades)", regla: MIG-07}
  - {id: TR-C09, columna: "Fecha del documento", tabla: "", dominio: MovimientoInventario.fecha, legado: fecha, regla: MIG-01}
  - {id: TR-C10, columna: "Tipo de documento de traslado, comprobante o documento interno", tabla: "Tabla 10", dominio: DocumentoSoporte.tipo, legado: nro_documento, regla: MIG-04}
  - {id: TR-C11, columna: "Serie", tabla: "", dominio: DocumentoSoporte.serie, legado: nro_documento, regla: MIG-04}
  - {id: TR-C12, columna: "Número", tabla: "", dominio: "DocumentoSoporte.numero (+ textoOriginal)", legado: nro_documento, regla: MIG-04}
  - {id: TR-C13, columna: "Tipo de operación", tabla: "Tabla 12", dominio: MovimientoInventario.tipoOperacion, legado: "(inferido de ingreso/salida y del documento)", regla: MIG-05}
  - {id: TR-C14, columna: "Entradas", tabla: "", dominio: MovimientoInventario.entrada, legado: ingreso, regla: MIG-02}
  - {id: TR-C15, columna: "Salidas", tabla: "", dominio: MovimientoInventario.salida, legado: salida, regla: MIG-02}
  - {id: TR-C16, columna: "Saldo final", tabla: "", dominio: MovimientoInventario.saldoFinal, legado: "(calculado y conciliado)", regla: MIG-10}
  - {id: TR-C17, columna: "(trazabilidad, no forma parte del formato)", tabla: "", dominio: "Linaje (idLegado, hashRegistro, reglas, versión)", legado: "idLegado (clave u archivo#hoja#fila)", regla: MIG-11}

# Matriz D - Requisitos del enunciado <-> artefactos <-> verificación
matriz_d:
  - {id: REQ-01, requisito: "Emitir CPE en UBL 2.1 (factura, boleta y notas)", artefactos: "docs/05; specs/schemas/comprobante-*.json; specs/ubl/ejemplos (4 XML)", verificacion: "XSD OASIS + cuadres (validar_specs.py)"}
  - {id: REQ-02, requisito: "Registros formales (14.1 / RVIE y 12.1)", artefactos: "Matrices B y C; GET /registros/*; inventario.schema.json (KardexFormato121)", verificacion: "Revisión de columnas contra los formatos oficiales"}
  - {id: REQ-03, requisito: "Validar RUC", artefactos: "VAL-ID-01 a 04; GET /consultas/ruc/{ruc}; ConsultaContribuyentePort", verificacion: "TC-03; contraejemplo i02"}
  - {id: REQ-04, requisito: "Calcular IGV, ISC (Cat. 08) e ICBPER", artefactos: "docs/04, sección 4.3; VAL-TRB-*; ejemplos F001-2 y B001-1", verificacion: "TC-07 a TC-09; cuadres de los XML"}
  - {id: REQ-05, requisito: "XML firmado digitalmente", artefactos: "FirmadorXmlPort; tools/conformidad/FirmarXmlPrueba.java; ejemplos firmados", verificacion: "Firma verificada + XSD (ds:Signature, lax)"}
  - {id: REQ-06, requisito: "Comunicación con OSE o SUNAT", artefactos: "docs/07, sección 7.6; CanalEnvioCpePort; estados (Figura 4.1)", verificacion: "Pruebas en el ambiente beta (fase de implementación)"}
  - {id: REQ-07, requisito: "Spec-First y estudio del UBL-Invoice-2.1.xsd", artefactos: "specs/ (contratos primero); docs/02, Tabla 2.2; esta matriz con cardinalidades del XSD", verificacion: "validar_specs.py en verde antes de programar"}
  - {id: REQ-08, requisito: "Migración del legado con trazabilidad", artefactos: "docs/09; migracion.schema.json; /migraciones/*; Matriz C", verificacion: "Controles CTL-01 a CTL-05; linaje"}
  - {id: REQ-09, requisito: "Catálogos, series, correlativos y validaciones (Catálogo 8)", artefactos: "catalogos-sunat.schema.json; VAL-NUM-*; docs/02, sección 2.5", verificacion: "Contraejemplos i01, i06; TC-12"}
  - {id: REQ-10, requisito: "MVC con visión hexagonal y microservicios", artefactos: "docs/06; x-puerto-entrada en el OpenAPI; AsyncAPI; reglas ArchUnit", verificacion: "ArchUnit / Spring Modulith en CI"}
  - {id: REQ-11, requisito: "Nativo en Windows y Android; MSI y APK", artefactos: "docs/06, sección 6.8 (Tabla 6.4); ADR-03", verificacion: "Pipeline de empaquetado (packageMsi / assembleRelease)"}
  - {id: REQ-12, requisito: "Casos de uso con opiniones de usuarios y benchmark", artefactos: "docs/03 (benchmark, PU-01 a PU-12, guion DEMO, CU-01 a CU-32)", verificacion: "Ejecución del guion DEMO por el equipo"}
  - {id: REQ-13, requisito: "Modelo de dominio y contratos", artefactos: "docs/05; specs/schemas (11 contratos)", verificacion: "Metaesquema + ejemplos"}
  - {id: REQ-14, requisito: "Diagramas MVC con visión hexagonal", artefactos: "docs/06, Figuras 6.1 a 6.8; diagramas/fuentes", verificacion: "Revisión de arquitectura"}
  - {id: REQ-15, requisito: "Endpoints y servicios (contratos API)", artefactos: "specs/openapi (50 operaciones); docs/07", verificacion: "openapi-spec-validator + Redocly"}
  - {id: REQ-16, requisito: "Matriz de trazabilidad normativa SUNAT ↔ UBL", artefactos: "docs/08; matriz-trazabilidad.xlsx; csv/", verificacion: "Cardinalidades calculadas del XSD oficial"}
  - {id: REQ-17, requisito: "Venta mayorista y minorista", artefactos: "producto.schema.json (Presentacion, Precio); FormaPago; bonificaciones", verificacion: "Ejemplos F001-1 y B001-1"}
  - {id: REQ-18, requisito: "Inventario integrado a la facturación", artefactos: "Evento ComprobanteEmitido; VAL-INV-03; inventario.schema.json", verificacion: "TC-16; AsyncAPI"}
  - {id: REQ-19, requisito: "Continuidad ante caídas de internet, OSE o SUNAT", artefactos: "ADR-05; outbox; reintentos; contingencia (RS 000049-2026)", verificacion: "Prueba de desconexión controlada"}
